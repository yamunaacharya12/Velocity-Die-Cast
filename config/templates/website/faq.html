{% extends 'website/layout.html' %}
{% block title %}FAQs — Velocity Die-Cast{% endblock %}
{% block content %}
<div class="container">
  <div class="hw-crumb"><a href="{% url 'home' %}">Home</a><span class="sep">/</span><span class="cur">FAQs</span></div>
  <div class="hw-info-page" style="max-width:820px;">
    <h1 class="hw-page-title">Frequently Asked Questions</h1>
    {% for q, a in faqs %}
      <div class="hw-faq-item" onclick="this.classList.toggle('open')">
        <div class="hw-faq-q">{{ q }}<span>+</span></div>
        <div class="hw-faq-a">{{ a }}</div>
      </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
