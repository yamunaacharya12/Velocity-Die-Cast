{% extends 'website/layout.html' %}
{% block title %}Sign In — Velocity Die-Cast{% endblock %}

{% block content %}
<div class="container">
  <div class="hw-auth-box">
    <h2>Welcome Back</h2>
    <p class="sub">Sign in to your collector account</p>
    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="hw-field mb-3"><label>Email Address</label><input type="email" name="email" required placeholder="alex@email.com"></div>
      <div class="hw-field mb-3"><label>Password</label><input type="password" name="password" required placeholder="••••••••"></div>
      <button type="submit" class="hw-btn hw-btn-primary hw-btn-block">Sign In</button>
    </form>
    <p class="hw-auth-switch">New here? <a href="{% url 'register' %}">Create an account</a></p>
    <p class="hw-auth-switch" style="margin-top:6px;font-size:11.5px;">Demo admin: <span class="hw-mono">admin / admin12345</span></p>
  </div>
</div>
{% endblock %}
